plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.everetro.poc'
    compileSdk 34

    buildFeatures {
        buildConfig true   // BuildConfig.VERSION_CODE for in-app update check
    }

    defaultConfig {
        applicationId "com.everetro.poc"
        minSdk 26
        targetSdk 34
        // Version: in a normal release it is driven by the git tag (release.yml
        // passes env ANDROID_VERSION_CODE/NAME, derived from tag v0.8.6 -> 806/"0.8.6").
        // Fallback for manual/test builds. versionCode MUST increase with every
        // release (the in-app updater uses it to detect a newer build).
        def vCode = (System.getenv("ANDROID_VERSION_CODE") ?: "806").toInteger()
        def vName = System.getenv("ANDROID_VERSION_NAME") ?: "0.8.6"
        versionCode vCode
        versionName vName

        ndk {
            // Real phones only (arm64). No emulator → x86_64 not needed.
            abiFilters "arm64-v8a"
        }

        python {
            version "3.12"
            pip {
                // Dependencies of the real app (app/web/main). All pure-Python wheels
                // available for Chaquopy arm64.
                install "fastapi==0.115.0"
                install "starlette==0.38.6"
                install "uvicorn==0.30.6"
                install "httpx==0.27.2"
                install "h11==0.14.0"
                install "httpcore==1.0.5"
                install "anyio==4.4.0"
                install "jinja2==3.1.4"
                install "PyJWT==2.9.0"
                install "python-multipart==0.0.9"
                install "rich==13.9.4"        // imported by app.auth.esi_oauth
                install "sqlalchemy==2.0.35"
                // pydantic v1 — v2 requires pydantic-core (Rust), which has NO
                // Chaquopy arm64 wheel (the build fails on maturin/sdist). v1 has a
                // pure-Python wheel; FastAPI 0.115 supports v1. The app code is
                // v1/v2 compatible (see app/models/blueprint.py).
                install "pydantic==1.10.18"
            }
        }
    }

    // Signing the release build with a persistent key (from GitHub Secrets, decoded
    // into a file in CI). Without it (a local build without env vars) signingConfig
    // stays empty and `assembleRelease` could not be signed — but that is fine for CI.
    signingConfigs {
        release {
            def ksFile = System.getenv("ANDROID_KEYSTORE_FILE")
            if (ksFile) {
                storeFile file(ksFile)
                storeType "PKCS12"
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("ANDROID_KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // kotlin-bom unifies kotlin-stdlib versions across transitive dependencies.
    // Without it: "Duplicate class kotlin.collections.jdk8.*" (stdlib 1.8.22 vs
    // stdlib-jdk8 1.6.21) — since Kotlin 1.8, jdk7/jdk8 are merged into stdlib.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
